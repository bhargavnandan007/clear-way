<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clearway | Commute Optimizer</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Geoapify Autocomplete CSS (Minimal Dark Theme to match your aesthetic) -->
    <link rel="stylesheet" href="https://unpkg.com/@geoapify/geocoder-autocomplete@1.4.0/styles/minimal-dark.css">
</head>
<body>
    <div class="app-container">
        <h1>Clearway</h1>
        <p class="subtitle">Find your perfect commute window.</p>

        <div class="input-group">
            <label>Starting Point</label>
            <div id="start-autocomplete" class="autocomplete-container"></div>
        </div>

        <div class="input-group">
            <label>Destination</label>
            <div id="end-autocomplete" class="autocomplete-container"></div>
        </div>

        <!-- NEW: Time Window Inputs -->
        <div class="time-inputs" style="display: flex; gap: 15px; margin-bottom: 20px;">
            <div style="flex: 1;">
                <label style="display: block; margin-bottom: 5px; font-size: 0.9em; color: var(--text-muted);">Earliest Start</label>
                <input type="time" id="start-time" value="12:00" style="width: 100%; padding: 10px; background: #222; border: 1px solid #333; color: white; border-radius: 4px;">
            </div>
            <div style="flex: 1;">
                <label style="display: block; margin-bottom: 5px; font-size: 0.9em; color: var(--text-muted);">Latest Start</label>
                <input type="time" id="end-time" value="16:00" style="width: 100%; padding: 10px; background: #222; border: 1px solid #333; color: white; border-radius: 4px;">
            </div>
        </div>

        <button id="calculate-btn">Calculate Commute</button>

        <div id="results-container" class="hidden">
            <h2>Commute Forecast</h2>
            <ul id="timeline-list"></ul>
        </div>
    </div>

    <!-- Geoapify Autocomplete Script (CDN) -->
    <script src="https://unpkg.com/@geoapify/geocoder-autocomplete@1.4.0/dist/index.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
